name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Format, lint and both compiler checks
        run: npm exec -- vp run check
      - run: npm run release:check
      - run: npm audit
  test:
    name: test / ${{ matrix.os }} / node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec -- vp run test
      - name: Synthetic browser acceptance
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        env:
          T3_TEST_BROWSER_PATH: /usr/bin/google-chrome
        run: npm exec -- vp run test:browser
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/control-plane/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
      - run: npm ci --ignore-scripts
        working-directory: packages/control-plane
      - run: npm run types && npm run typecheck && npm test && npm run build && npm audit
        working-directory: packages/control-plane
      - run: npm run staging:qualify
        working-directory: packages/control-plane
      - name: Retain exact-source central and edge runtime artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kadenco-central-runtime-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/
            packages/control-plane/dist/
            LICENSE
            NOTICE
            package.json
            package-lock.json
            packages/control-plane/package.json
            packages/control-plane/package-lock.json
  gate:
    if: always()
    needs: [quality, test, control-plane]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality and platform job
        env:
          QUALITY: ${{ needs.quality.result }}
          TEST: ${{ needs.test.result }}
          CONTROL: ${{ needs.control-plane.result }}
        run: test "$QUALITY" = success && test "$TEST" = success && test "$CONTROL" = success
