name: Release artifact
run-name: Release ${{ inputs.release_request_id || github.ref_name }}
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_request_id:
        description: Stable release invocation UUID for dispatch reconciliation
        required: false
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - run: npm run build
      - run: npm ci --ignore-scripts
        working-directory: packages/control-plane
      - name: Build matching central Worker and compiled edge runtime
        run: npm run build && node operator/build-worker.mjs && node node_modules/cf/bin/cf deploy --prebuilt --dry-run --mode production
        working-directory: packages/control-plane
      - name: Package and smoke-test extracted production installation
        run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kadenco-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-output/
          if-no-files-found: error
          retention-days: 30
  # Fleet members install a release only when GitHub attests its package was
  # built by this workflow on main (docs/fleet-update.md). Separate job so the
  # build itself never holds signing permissions; PR runs are not attested.
  attest:
    needs: package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: kadenco-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-output
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            release-output/kadenco-*.tgz
            release-output/kadenco-control-plane-*.tar.gz
