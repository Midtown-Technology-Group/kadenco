name: Release artifact
run-name: Release ${{ inputs.release_request_id || github.ref_name }}
on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_request_id:
        description: Stable release invocation UUID for dispatch reconciliation
        required: false
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:check
      - run: npm run build
      - run: npm ci --ignore-scripts
        working-directory: packages/control-plane
      - name: Build matching central Worker and compiled edge runtime
        run: npm run build && node operator/build-worker.mjs && node node_modules/cf/bin/cf deploy --prebuilt --dry-run --mode production
        working-directory: packages/control-plane
      - name: Package and smoke-test extracted production installation
        run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: kadenco-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-output/
          if-no-files-found: error
          retention-days: 30
